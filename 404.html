<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Dijumpai | NH Ivory Home Sdn. Bhd.</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ED1C24">
  <link rel="icon" href="assets/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #4A4A4A;
      background: radial-gradient(800px 400px at 50% -10%, rgba(200,16,46,.10), transparent 60%), #F7F7F8;
    }
    .box {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 18px;
      padding: 2.5rem 1.75rem;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(26,26,26,.08);
    }
    .icon {
      width: 68px; height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: #C8102E;
      color: #fff;
      display: grid; place-items: center;
      font-family: "Poppins", sans-serif;
      font-size: 2rem;
      font-weight: 800;
      box-shadow: 0 20px 50px rgba(200,16,46,.18);
    }
    h1 { font-family: "Poppins", sans-serif; font-size: 1.5rem; color: #1A1A1A; margin: 0 0 .5rem; }
    p { margin: 0 0 1.75rem; font-size: .95rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: .85rem 1.6rem;
      border-radius: 999px;
      background: #C8102E;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(200,16,46,.3);
    }
    a:hover { background: #8E0B20; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon" aria-hidden="true">?</div>
    <h1>Halaman Tidak Dijumpai</h1>
    <p>Maaf, halaman yang anda cari tidak wujud.</p>
    <a href="#" id="homeLink">Kembali Ke Laman Utama</a>
  </div>
  <script>
    (function () {
      var seg = location.pathname.split("/")[1];
      var root = "/" + (seg ? seg + "/" : "");
      var link = document.getElementById("homeLink");
      link.setAttribute("href", root);
      setTimeout(function () { location.replace(root); }, 4000);
    })();
  </script>
</body>
</html>
